# Put the wtype shim ahead of the real /usr/bin/wtype so voxtype types through
# the focus guard and the word-chunking fix for Electron apps.
# See shim/wtype.
[Service]
Environment=PATH=%h/.local/share/voxtype-shim:/usr/share/omarchy/bin:%h/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/bin:%h/.local/bin
